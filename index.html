<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Track - Ultimate Smooth Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #05070a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: #0f1319;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #topBar {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 6;
            pointer-events: none;
        }
        #scoreBoard {
            color: #ffffff;
            font-size: 11px; 
            font-weight: 800;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            background: rgba(15, 21, 32, 0.88);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 14px; 
            padding: 8px 14px; 
            flex-grow: 1;
        }
        .sb-item {
            white-space: nowrap;
        }
        .pause-btn {
            padding: 7px 15px;
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            background: rgba(15, 21, 32, 0.9);
            border: 1px solid #00e5ff;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: auto;
            display: none;
            margin-left: 10px; 
            white-space: nowrap;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 80px;
            align-items: center;
            width: 100%;
            position: absolute;
            bottom: 110px; 
            padding: 0 25px;
            pointer-events: none;
            z-index: 5;
        }
        .btn {
            width: 84px;
            height: 84px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            color: white;
            font-size: 32px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        #welcomeScreen { background: #07090e; display: none; }
        .welcome-title {
            color: #00e5ff;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
        }
        
        #gameOverScreen { background: rgba(7, 9, 14, 0.96); display: none; }
        .game-over-title {
            color: #ff2222;
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 40px;
            text-shadow: 0 0 25px rgba(255, 34, 34, 0.5);
        }
        
        .menu-btn {
            padding: 15px 50px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background: #11151d;
            border: 2px solid #00e5ff;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
        }
        #restartBtn { border-color: #ff2222; }

        #countdownOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(5, 7, 10, 0.85);
            z-index: 9;
        }
        #countdownText {
            font-size: 280px; 
            font-weight: 900;
            color: #facc15; 
            text-shadow: 0 0 60px rgba(250, 204, 21, 0.5), 0 4px 20px rgba(0,0,0,0.6);
            opacity: 0;
            transform: scale(1.7);
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.75s ease-out;
        }
        #countdownText.animate {
            transform: scale(0.95);
            opacity: 1;
        }

        #rewardToast {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%) scale(0.85);
            background: #22c55e;
            color: #ffffff;
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(34, 197, 94, 0.5);
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            width: 90%;
            direction: rtl;
        }
        #rewardToast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        #authErrorScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #06080c 0%, #0b101a 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 30px;
            text-align: center;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
        }
        .error-card {
            background: rgba(15, 22, 36, 0.65);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 28px;
            padding: 50px 35px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(239, 68, 68, 0.03);
            max-width: 420px;
            width: 100%;
        }
        .error-icon {
            font-size: 60px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.5));
            animation: pulseCard 2.5s infinite ease-in-out;
        }
        .error-title-en {
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .error-desc-en {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.5;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="authErrorScreen">
        <div class="error-card">
            <div class="error-icon">🔒</div>
            <div class="error-title-en">Access Denied</div>
            <div class="error-desc-en">You do not have permission to enter the game</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="topBar">
        <div id="scoreBoard">
            <span class="sb-item" id="sbPass">PASS: 0/10</span>
            <span class="sb-item" id="sbScore">SCORE: 0</span>
            <span class="sb-item" id="sbStage">STAGE: 1</span>
        </div>
        <button id="pauseBtn" class="pause-btn">Pause</button>
    </div>

    <div id="rewardToast">تبریک! شما جایزه ی خفن این مرحله رو بردید!</div>
    
    <div id="controls">
        <button id="btnLeft" class="btn">◀</button>
        <button id="btnRight" class="btn">▶</button>
    </div>

    <div id="welcomeScreen" class="screen-overlay">
        <div class="welcome-title">TURBO TRACK</div>
        <button id="startBtn" class="menu-btn">Start Race</button>
    </div>

    <div id="gameOverScreen" class="screen-overlay">
        <div class="game-over-title">GAME OVER</div>
        <button id="restartBtn" class="menu-btn">Race Again</button>
    </div>

    <div id="countdownOverlay">
        <div id="countdownText">3</div>
    </div>
</div>

<script>
// --- لیست سفید کاربران مجاز ---
const ALLOWED_USERS = [
    2049044424,         
    "your_username"    
];

function verifyTelegramAccess() {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const authErrorScreen = document.getElementById('authErrorScreen');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const user = tg.initDataUnsafe?.user;

    if (!tg.initData || !user) {
        authErrorScreen.style.display = 'none';
        welcomeScreen.style.display = 'flex';
        return;
    }

    const currentUserId = user.id ? Number(user.id) : null;
    const currentUsername = user.username ? user.username.toLowerCase().trim() : "";

    const isAllowed = ALLOWED_USERS.some(allowed => {
        if (typeof allowed === 'number' && currentUserId !== null) {
            return allowed === currentUserId;
        }
        if (typeof allowed === 'string' && currentUsername !== "") {
            let cleanAllowed = allowed.toLowerCase().replace('@', '').trim();
            return cleanAllowed === currentUsername;
        }
        return false;
    });

    if (isAllowed) {
        authErrorScreen.style.display = 'none';
        welcomeScreen.style.display = 'flex';
    } else {
        authErrorScreen.style.display = 'flex';
        welcomeScreen.style.display = 'none';
    }
}

verifyTelegramAccess();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const welcomeScreen = document.getElementById('welcomeScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const countdownOverlay = document.getElementById('countdownOverlay');
const countdownText = document.getElementById('countdownText');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');

const sbPass = document.getElementById('sbPass');
const sbScore = document.getElementById('sbScore');
const sbStage = document.getElementById('sbStage');
const rewardToast = document.getElementById('rewardToast');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
resizeCanvas();

const player = {
    x: canvas.width / 2,
    y: 520,
    width: 48,
    height: 76,
    movingLeft: false,
    movingRight: false,
    speed: 520 // افزایش جزئی سرعت واکنش کلیدها بر پایه محاسبات دلتا
};

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let musicInterval = null;
let musicStep = 0;

const luxuryMelody = [
    185, 0, 220, 0, 185, 185, 246, 0,
    220, 0, 185, 0, 220, 246, 185, 0
];

function playSoundEffect(freq, duration, vol, type = 'sine', delay = 0) {
    if (isPaused) return; 
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.linearRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.01);
}

function playMusicNode() {
    if (!isPlaying || isPaused || isBurning) return; 
    const freq = luxuryMelody[musicStep % luxuryMelody.length];
    musicStep++;
    if (freq === 0) return;
    playSoundEffect(freq, 0.18, 0.45, 'triangle'); 
}

function startMusic() { stopMusic(); musicStep = 0; musicInterval = setInterval(playMusicNode, 180); } 
function stopMusic() { if (musicInterval) { clearInterval(musicInterval); musicInterval = null; } }

function playClickSound() { playSoundEffect(800, 0.02, 0.3, 'sine'); }

function playMarioDeathSound() {
    const mNotes = [440, 392, 349, 293];
    const timings = [0.0, 0.06, 0.12, 0.18]; 
    const durations = [0.05, 0.05, 0.05, 0.15]; 
    mNotes.forEach((freq, idx) => {
        playSoundEffect(freq, durations[idx], 0.45, 'sawtooth', timings[idx]);
    });
}

function playBeep() { playSoundEffect(550, 0.08, 0.45, 'sine'); }

function playRewardSound() {
    [523, 659, 784].forEach((f, i) => {
        playSoundEffect(f, 0.08, 0.45, 'sine', i * 0.06);
    });
}

const stageJobs = [
    { key: 'ambulance', name: 'AMBU', type: 'STANDARD', color: '#e11d48' },
    { key: 'taxi', name: 'TAXI', type: 'STANDARD', color: '#eab308' },
    { key: 'police', name: 'POLICE', type: 'SPEED_OBSTACLE', color: '#2563eb' }, 
    { key: 'motor', name: 'MOTO', type: 'BIKE', color: '#16a34a' },     
    { key: 'bicycle', name: 'BIKE', type: 'BIKE', color: '#db2777' },     
    { key: 'racecar', name: 'RACE', type: 'SPEED_OBSTACLE', color: '#ea580c' },       
    { key: 'personal', name: 'CAR', type: 'STANDARD', color: '#9333ea' },             
    { key: 'truck', name: 'TRUCK', type: 'BIG_SIZE', color: '#3f51b5' },             
    { key: 'garbage', name: 'GARB', type: 'BIG_SIZE', color: '#4caf50' },             
    { key: 'fire', name: 'FIRE', type: 'CHAOS', color: '#f43f5e' }             
];

let score = 0;
let currentStageIndex = 0; 
let passedCarsCount = 0; 
let isPlaying = false;
let isPaused = false; 
let isBurning = false; 
let lastTime = 0;
let roadLinesY = 0;
let enemySpawnTimer = 0;
let enemies = [];
let particles = [];
let sceneryItems = [];
let lastSpawnLane = -1; 

let currentRoadSpeed = 540; 
let speedMultiplierPerStage = 160; 

function updateScoreUI() {
    sbPass.innerText = `PASS: ${passedCarsCount}/10`;
    sbScore.innerText = `SCORE: ${score}`;
    sbStage.innerText = `STAGE: ${currentStageIndex + 1}`;
}

function checkStageProgression() {
    passedCarsCount++;
    if (passedCarsCount >= 10) {
        passedCarsCount = 0;
        currentStageIndex = (currentStageIndex < stageJobs.length - 1) ? currentStageIndex + 1 : 0;
        currentRoadSpeed = 540 + (currentStageIndex * speedMultiplierPerStage);
        showRewardNotification("تبریک! شما جایزه ی خفن این مرحله رو بردید!");
    }
    updateScoreUI();
}

function showRewardNotification(text) {
    rewardToast.innerText = text;
    rewardToast.classList.add('show');
    playRewardSound();
    setTimeout(() => { rewardToast.classList.remove('show'); }, 2500);
}

function initScenery() {
    sceneryItems = [];
    for (let y = -100; y < canvas.height + 100; y += 120) {
        sceneryItems.push({ x: canvas.width * 0.035, y: y });
        sceneryItems.push({ x: canvas.width * 0.945, y: y + 60 });
    }
}

function updateAndDrawScenery(speed, dt) {
    ctx.fillStyle = '#14341e';
    ctx.fillRect(0, 0, canvas.width * 0.08, canvas.height);
    ctx.fillRect(canvas.width * 0.92, 0, canvas.width * 0.08, canvas.height);

    const len = sceneryItems.length;
    ctx.fillStyle = '#22c55e';
    for(let i=0; i<len; i++) {
        const item = sceneryItems[i];
        if (isPlaying && !isPaused && !isBurning) item.y += speed * dt;
        if (item.y > canvas.height + 40) item.y = -40;

        ctx.beginPath(); ctx.moveTo(item.x, item.y + 8); ctx.lineTo(item.x - 8, item.y + 24); ctx.lineTo(item.x + 8, item.y + 24); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(item.x, item.y); ctx.lineTo(item.x - 5, item.y + 12); ctx.lineTo(item.x + 5, item.y + 12); ctx.closePath(); ctx.fill();
    }
}

class ExplodeParticle {
    constructor(x, y, isFire = false) {
        this.x = x; this.y = y; this.isFire = isFire;
        this.radius = isFire ? Math.random() * 4 + 2 : Math.random() * 2 + 1;
        const angle = Math.random() * Math.PI * 2;
        const speed = isFire ? Math.random() * 110 + 30 : Math.random() * 160 + 70;
        this.vx = Math.cos(angle) * speed; 
        this.vy = isFire ? (Math.sin(angle) * speed * 0.4) - 40 : Math.sin(angle) * speed; 
        this.alpha = 1;
        this.decay = isFire ? Math.random() * 0.9 + 1.0 : 1.8;
        if (isFire) {
            this.color = ['#ef4444', '#f97316', '#facc15', '#475569', '#1e293b'][Math.floor(Math.random() * 5)];
        } else {
            this.color = '#00e5ff';
        }
    }
    update(dt) { 
        this.x += this.vx * dt; 
        this.y += this.vy * dt; 
        this.alpha -= this.decay * dt; 
    }
    draw() {
        if (this.alpha <= 0) return;
        ctx.save(); 
        ctx.globalAlpha = this.alpha; 
        ctx.fillStyle = this.color;
        ctx.beginPath(); 
        ctx.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2); 
        ctx.fill(); 
        ctx.restore();
    }
}

// تابع رندر جدید و کاملاً اختصاصی خودروها با چرخ، رینگ، کاپوت، صندوق و چراغ‌ها
function drawRealtimeVehicle(x, y, width, height, color, name, type, isPlayer = false) {
    ctx.save();
    ctx.translate(x, y);

    // ۱. سایه دقیق سه‌بعدی متصل به زمین زیر خودرو
    ctx.fillStyle = 'rgba(0,0,0,0.48)';
    ctx.beginPath();
    ctx.roundRect(-width/2 + 2, -height/2 + 6, width, height, 14);
    ctx.fill();

    const isBike = (type === 'BIKE');
    const coreW = isBike ? width * 0.55 : width * 0.92;

    // ۲. ترسیم ۴ عدد تایر واقعی و ضخیم با رینگ‌های داخلی آلومینیومی سفید رنگ
    ctx.fillStyle = '#090d16'; // رنگ لاستیک
    const tireW = 6;
    const tireH = 15;
    if (!isBike) {
        // چرخ جلو چپ
        ctx.fillRect(-width/2 - 2, -height/2 + 12, tireW, tireH);
        // چرخ جلو راست
        ctx.fillRect(width/2 - 4, -height/2 + 12, tireW, tireH);
        // چرخ عقب چپ
        ctx.fillRect(-width/2 - 2, height/2 - 27, tireW, tireH);
        // چرخ عقب راست
        ctx.fillRect(width/2 - 4, height/2 - 27, tireW, tireH);

        // خط رینگ‌های سفید وسط چرخ‌ها جهت وضوح عالی
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-width/2, -height/2 + 17, 2, 5);
        ctx.fillRect(width/2 - 2, -height/2 + 17, 2, 5);
        ctx.fillRect(-width/2, height/2 - 22, 2, 5);
        ctx.fillRect(width/2 - 2, height/2 - 22, 2, 5);
    } else {
        // تایرهای موتور
        ctx.fillStyle = '#090d16';
        ctx.fillRect(-2.5, -height/2 + 6, 5, 16);
        ctx.fillRect(-2.5, height/2 - 22, 5, 16);
    }

    // ۳. بدنه اصلی ماشین
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(-coreW/2, -height/2, coreW, height, isBike ? 6 : 14);
    ctx.fill();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = '#020617';
    ctx.stroke();

    if (!isBike) {
        // ۴. کاپوت جلو (ترسیم خط شیار کاپوت به صورت گرافیکی مدرن)
        ctx.strokeStyle = 'rgba(0,0,0,0.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-coreW/2 + 4, -height/2 + 15);
        ctx.lineTo(coreW/2 - 4, -height/2 + 15);
        ctx.stroke();

        // ۵. صندوق عقب (ترسیم قوس یا خط تفکیک صندوق عقب ماشین)
        ctx.beginPath();
        ctx.moveTo(-coreW/2 + 5, height/2 - 12);
        ctx.lineTo(coreW/2 - 5, height/2 - 12);
        ctx.stroke();
    }

    // ۶. کابین و پنجره‌ها با رفلکس براق داخلی
    ctx.fillStyle = 'rgba(11,18,32,0.95)';
    ctx.beginPath();
    if (!isBike) {
        ctx.roundRect(-coreW/2 + 4, -height/6, coreW - 8, height * 0.50, 6);
    } else {
        ctx.roundRect(-coreW/4, -2, coreW/2, height * 0.25, 2);
    }
    ctx.fill();

    // رفلکس شیشه جلو
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    if(!isBike) {
        ctx.moveTo(-coreW/2 + 8, -height/9);
        ctx.lineTo(coreW/2 - 8, -height/9);
        ctx.stroke();
    }

    // ۷. چراغ‌های پرنور جلو (زنون سفید)
    ctx.save();
    if (!isBike) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffffff';
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-coreW/2 + 1, -height/2, 8, 4);
        ctx.fillRect(coreW/2 - 9, -height/2, 8, 4);
    }
    ctx.restore();

    // ۸. چراغ‌های خطر عقب (قرمز ال‌ای‌دی)
    ctx.save();
    if (!isBike) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff0044';
        ctx.fillStyle = '#ff0044';
        ctx.fillRect(-coreW/2 + 2, height/2 - 4, 8, 4);
        ctx.fillRect(coreW/2 - 10, height/2 - 4, 8, 4);
    }
    ctx.restore();

    // متن نام خوانای وسیله
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 9px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name, 0, isBike ? -8 : 4);

    ctx.restore();
}

class EnemyCar {
    constructor() {
        this.jobSpec = stageJobs[currentStageIndex];
        this.width = (this.jobSpec.type === 'BIG_SIZE') ? 54 : (this.jobSpec.type === 'BIKE' ? 28 : 48);
        this.height = (this.jobSpec.type === 'BIG_SIZE') ? 92 : 76;
        
        const lanes = [canvas.width * 0.23, canvas.width * 0.5, canvas.width * 0.77];
        let targetLaneIndex = Math.floor(Math.random() * lanes.length);
        if (targetLaneIndex === lastSpawnLane) {
            targetLaneIndex = (targetLaneIndex + 1) % lanes.length;
        }
        lastSpawnLane = targetLaneIndex;
        
        this.x = lanes[targetLaneIndex];
        this.y = -120;
        this.speed = currentRoadSpeed; 
        this.passed = false;
    }
    update(dt) { this.y += this.speed * dt; }
    draw() {
        drawRealtimeVehicle(this.x, this.y, this.width, this.height, this.jobSpec.color, this.jobSpec.name, this.jobSpec.type, false);
    }
}

function handleEnemies(dt) {
    if (!isPaused && !isBurning) enemySpawnTimer += dt;
    
    let baseInterval = 0.85 - (currentStageIndex * 0.09);
    const spawnInterval = Math.max(0.24, baseInterval); 
    
    if (enemySpawnTimer > spawnInterval && !isPaused && !isBurning) {
        enemies.push(new EnemyCar());
        enemySpawnTimer = 0;
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        if (!isPaused && !isBurning) enemies[i].update(dt);
        enemies[i].draw();

        if (!enemies[i].passed && enemies[i].y > player.y + player.height / 2) {
            enemies[i].passed = true;
            score += 25;
            checkStageProgression();
        }

        if (enemies[i].y > canvas.height + 120) {
            enemies.splice(i, 1);
            continue;
        }

        if (!isBurning && intersects(player.x, player.y, player.width, player.height, enemies[i].x, enemies[i].y, enemies[i].width, enemies[i].height)) {
            triggerCarBurnEffect();
            return;
        }
    }
}

function intersects(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 - w1/2.3 < x2 + w2/2.3 && x1 + w1/2.3 > x2 - w2/2.3 && y1 - h1/2.3 < y2 + h2/2.3 && y1 + h1/2.3 > y2 - h2/2.3;
}

function triggerCarBurnEffect() {
    isBurning = true;
    stopMusic(); 
    playMarioDeathSound();
    
    let burnCounter = 0;
    const burnInterval = setInterval(() => {
        for (let p = 0; p < 4; p++) {
            particles.push(new ExplodeParticle(player.x + (Math.random()*12 - 6), player.y + (Math.random()*16 - 8), true));
        }
        burnCounter++;
        if (burnCounter > 12) { 
            clearInterval(burnInterval);
            gameOver();
        }
    }, 50);
}

function drawRoad(dt) {
    ctx.fillStyle = '#161a22';
    ctx.fillRect(canvas.width * 0.08, 0, canvas.width * 0.84, canvas.height);

    const leftLimit = canvas.width * 0.08;
    const rightLimit = canvas.width * 0.92 - 6;

    updateAndDrawScenery(currentRoadSpeed, dt);

    ctx.fillStyle = '#ea580c';
    ctx.fillRect(leftLimit, 0, 5, canvas.height);
    ctx.fillRect(rightLimit, 0, 5, canvas.height);

    if (isPlaying && !isPaused && !isBurning) {
        if (player.x - player.width / 2 <= leftLimit + 5 || player.x + player.width / 2 >= rightLimit) {
            triggerCarBurnEffect();
            return;
        }
    }

    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    if (!isPaused && !isBurning) roadLinesY = (roadLinesY + currentRoadSpeed * dt) % 65;

    for (let y = roadLinesY - 65; y < canvas.height; y += 65) {
        ctx.fillRect(canvas.width * 0.38 - 1, y, 2, 30);
        ctx.fillRect(canvas.width * 0.62 - 1, y, 2, 30);
    }
}

function startCountdown() {
    welcomeScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    pauseBtn.style.display = 'none';
    countdownOverlay.style.display = 'flex';
    
    let states = ['3', '2', '1'];
    let current = 0;

    function nextTick() {
        if (current < states.length) {
            countdownText.innerText = states[current];
            countdownText.classList.remove('animate');
            void countdownText.offsetWidth; 
            countdownText.classList.add('animate');
            current++;
            setTimeout(nextTick, 850);
        } else {
            countdownOverlay.style.display = 'none';
            playBeep();
            isPlaying = true; isPaused = false; isBurning = false;
            pauseBtn.innerText = "Pause"; pauseBtn.style.display = 'block';
            lastTime = performance.now();
            startMusic(); 
            requestAnimationFrame(loop);
        }
    }
    nextTick();
}

pauseBtn.addEventListener('click', () => {
    if (isBurning) return;
    isPaused = !isPaused;
    pauseBtn.innerText = isPaused ? "Resume" : "Pause";
    if (!isPaused) { lastTime = performance.now(); requestAnimationFrame(loop); }
});

function gameOver() { 
    isPlaying = false; 
    pauseBtn.style.display = 'none'; 
    gameOverScreen.style.display = 'flex'; 
}

function resetGame() {
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    stopMusic(); 
    score = 0; currentStageIndex = 0; passedCarsCount = 0; lastSpawnLane = -1;
    currentRoadSpeed = 540;
    isBurning = false;
    updateScoreUI();
    
    resizeCanvas();
    player.x = canvas.width / 2; player.y = 520; 
    enemies = []; particles = []; enemySpawnTimer = -0.1;
    initScenery();
    startCountdown();
}

function loop(currentTime) {
    if (!isPlaying || isPaused) return;

    // تکنیک درون‌یابی دلتا فریم جهت روان‌سازی خالص بدون کوچک‌ترین لگ یا پرش
    let dt = (currentTime - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; 
    lastTime = currentTime;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawRoad(dt);

    if (isPlaying && !isPaused && !isBurning) {
        if (player.movingLeft) player.x -= player.speed * dt;
        if (player.movingRight) player.x += player.speed * dt;
    }

    if (!isBurning) {
        drawRealtimeVehicle(player.x, player.y, player.width, player.height, '#00e5ff', 'YOU', 'STANDARD', true);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt); particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    handleEnemies(dt);
    if (isPlaying && !isPaused) requestAnimationFrame(loop);
}

const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

btnLeft.addEventListener('mousedown', (e) => { if(!isPaused && !isBurning) { player.movingLeft = true; playClickSound(); } });
btnLeft.addEventListener('mouseup', () => player.movingLeft = false);
btnLeft.addEventListener('mouseleave', () => player.movingLeft = false);
btnLeft.addEventListener('touchstart', (e) => { 
    if (e.cancelable) e.preventDefault(); 
    if(!isPaused && !isBurning) { player.movingLeft = true; playClickSound(); } 
}, { passive: false });
btnLeft.addEventListener('touchend', (e) => {
    if (e.cancelable) e.preventDefault();
    player.movingLeft = false;
}, { passive: false });

btnRight.addEventListener('mousedown', (e) => { if(!isPaused && !isBurning) { player.movingRight = true; playClickSound(); } });
btnRight.addEventListener('mouseup', () => player.movingRight = false);
btnRight.addEventListener('mouseleave', () => player.movingRight = false);
btnRight.addEventListener('touchstart', (e) => { 
    if (e.cancelable) e.preventDefault(); 
    if(!isPaused && !isBurning) { player.movingRight = true; playClickSound(); } 
}, { passive: false });
btnRight.addEventListener('touchend', (e) => {
    if (e.cancelable) e.preventDefault();
    player.movingRight = false;
}, { passive: false });

startBtn.addEventListener('click', resetGame);
restartBtn.addEventListener('click', resetGame);

window.addEventListener('load', () => {
    resizeCanvas();
    player.x = canvas.width / 2; player.y = 520;
    initScenery();
});
</script>

</body>
</html>
