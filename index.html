<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Track - Neon Speed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #05070a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: #0f1319;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #topBar {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 6;
            pointer-events: none;
        }
        #scoreBoard {
            color: #ffffff;
            font-size: 11px; 
            font-weight: 800;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            background: rgba(15, 21, 32, 0.88);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 14px; 
            padding: 8px 14px; 
            flex-grow: 1;
        }
        .sb-item {
            white-space: nowrap;
        }
        .pause-btn {
            padding: 7px 15px;
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            background: rgba(15, 21, 32, 0.9);
            border: 1px solid #00e5ff;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: auto;
            display: none;
            margin-left: 10px; 
            white-space: nowrap;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 80px;
            align-items: center;
            width: 100%;
            position: absolute;
            bottom: 110px; 
            padding: 0 25px;
            pointer-events: none;
            z-index: 5;
        }
        .btn {
            width: 84px;
            height: 84px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            color: white;
            font-size: 32px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            will-change: transform;
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        #welcomeScreen { background: #07090e; display: none; }
        .welcome-title {
            color: #00e5ff;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
        }
        
        #gameOverScreen { background: rgba(7, 9, 14, 0.96); display: none; }
        .game-over-title {
            color: #ff2222;
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 40px;
            text-shadow: 0 0 25px rgba(255, 34, 34, 0.5);
        }
        
        .menu-btn {
            padding: 15px 50px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background: #11151d;
            border: 2px solid #00e5ff;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
        }
        #restartBtn { border-color: #ff2222; }

        /* Neon & Static Countdown Configuration */
        #countdownOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(5, 7, 10, 0.88);
            z-index: 9;
        }
        #countdownText {
            font-size: 240px; 
            font-weight: 900;
            color: #00e5ff; 
            /* Fixed Position Neon Glow System - No scaling animation to prevent jitter */
            text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff, 0 0 40px #00b0ff, 0 0 80px #00b0ff;
            opacity: 1;
            transform: scale(1);
            will-change: opacity;
        }

        #rewardToast {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%) scale(0.85);
            background: #facc15;
            color: #000000;
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(250, 204, 21, 0.5);
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            width: 90%;
            direction: ltr; /* English alignment */
        }
        #rewardToast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        #authLockScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #06080c;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .lock-card {
            background: rgba(15, 20, 30, 0.95);
            border: 2px solid #ef4444;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
        }
        .lock-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }
        .lock-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .lock-desc {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="authLockScreen">
        <div class="lock-card">
            <div class="lock-icon">🔒</div>
            <div class="lock-title">Access Denied</div>
            <div class="lock-desc">You do not have permission to play this game.</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="topBar">
        <div id="scoreBoard">
            <span class="sb-item" id="sbPass">PASS: 0/10</span>
            <span class="sb-item" id="sbScore">SCORE: 0</span>
            <span class="sb-item" id="sbStage">STAGE: 1</span>
        </div>
        <button id="pauseBtn" class="pause-btn">Pause</button>
    </div>

    <div id="rewardToast">Congratulations! You won the awesome prize of this stage! 🔥</div>
    
    <div id="controls">
        <button id="btnLeft" class="btn">◀</button>
        <button id="btnRight" class="btn">▶</button>
    </div>

    <div id="welcomeScreen" class="screen-overlay">
        <div class="welcome-title">TURBO TRACK</div>
        <button id="startBtn" class="menu-btn">Start Race</button>
    </div>

    <div id="gameOverScreen" class="screen-overlay">
        <div class="game-over-title">GAME OVER</div>
        <button id="restartBtn" class="menu-btn">Race Again</button>
    </div>

    <div id="countdownOverlay">
        <div id="countdownText">3</div>
    </div>
</div>

<script>
const ALLOWED_USERS = [
    2049044424,         
    "your_username"    
];

function checkTelegramAuthorization() {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const authLockScreen = document.getElementById('authLockScreen');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const user = tg.initDataUnsafe?.user;

    if (!tg.initData || !user) {
        authLockScreen.style.display = 'none';
        welcomeScreen.style.display = 'flex';
        return;
    }

    const userId = user.id ? Number(user.id) : null;
    const username = user.username ? user.username.toLowerCase().trim() : "";

    const hasAccess = ALLOWED_USERS.some(item => {
        if (typeof item === 'number' && userId !== null) {
            return item === userId;
        }
        if (typeof item === 'string' && username !== "") {
            return item.toLowerCase().replace('@', '').trim() === username;
        }
        return false;
    });

    if (hasAccess) {
        authLockScreen.style.display = 'none';
        welcomeScreen.style.display = 'flex';
    } else {
        authLockScreen.style.display = 'flex';
        welcomeScreen.style.display = 'none';
    }
}

checkTelegramAuthorization();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = true;

const welcomeScreen = document.getElementById('welcomeScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const countdownOverlay = document.getElementById('countdownOverlay');
const countdownText = document.getElementById('countdownText');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');

const sbPass = document.getElementById('sbPass');
const sbScore = document.getElementById('sbScore');
const sbStage = document.getElementById('sbStage');
const rewardToast = document.getElementById('rewardToast');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
resizeCanvas();

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let musicTimer = 0;
let musicStep = 0;

// Fast & Furious Automotive / Cinematic Ambient Note Matrix (Aggressive yet Soft Background Line)
const fastFuriousMelody = [73.42, 73.42, 110.00, 0, 98.00, 98.00, 146.83, 0, 87.31, 87.31, 130.81, 0, 73.42, 0, 164.81, 0];

function playSoundEffect(freq, duration, vol, type = 'sawtooth', delay = 0) {
    if (isPaused || !isPlaying) return; 
    try {
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        
        // Exact volume level calibration matching the burn sound footprint
        gain.gain.setValueAtTime(vol * 0.10, now); 
        gain.gain.linearRampToValueAtTime(0.0001, now + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.01);
    } catch(e) {}
}

function processInlineMusic(dt) {
    if (!isPlaying || isPaused || isBurning) return;
    musicTimer += dt;
    if (musicTimer >= 0.25) {
        musicTimer = 0;
        const freq = fastFuriousMelody[musicStep % fastFuriousMelody.length];
        musicStep++;
        if (freq > 0) {
            // Uses a stylized sawtooth wave paired down to sound like a distant high-rev racing drone
            playSoundEffect(freq, 0.22, 0.18, 'sawtooth'); 
        }
    }
}

function playClickSound() { playSoundEffect(500, 0.02, 0.08, 'sine'); }

function playMarioDeathSound() {
    // Calibrated exactly matching the new background theme volume
    const mNotes = [220.00, 196.00, 146.83, 110.00];
    mNotes.forEach((freq, idx) => {
        playSoundEffect(freq, 0.16, 0.18, 'triangle', idx * 0.08);
    });
}

function playBeep() { playSoundEffect(587.33, 0.08, 0.12, 'sine'); }

function playRewardSound() {
    [349.23, 440.00, 523.25, 698.46].forEach((f, i) => {
        playSoundEffect(f, 0.12, 0.15, 'sine', i * 0.05);
    });
}

// Prizes config containing dynamic variables (Color, Jobs, Name Changes) fully split from speed
const stageJobs = [
    { key: 'taxi', name: 'TAXI', color: '#facc15', type: 'STANDARD' },
    { key: 'police', name: 'POLICE', color: '#1e293b', type: 'SPEED_OBSTACLE' }, 
    { key: 'ambulance', name: 'AMBU', color: '#c084fc', type: 'NEW_COLOR' },     
    { key: 'truck', name: 'TRUCK', color: '#0284c7', type: 'BIG_SIZE' },       
    { key: 'fire', name: 'FIRE', color: '#dc2626', type: 'CHAOS' }             
];

const vehicleCacheCanvases = {};

function generateVehicleGraphicsCache(key, color, name, isPlayer = false) {
    const w = 90, h = 130;
    const cacheCanvas = document.createElement('canvas');
    cacheCanvas.width = w; cacheCanvas.height = h;
    const c = cacheCanvas.getContext('2d');

    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.beginPath(); c.roundRect(6, 12, 78, 114, 22); c.fill();

    c.fillStyle = '#64748b';
    c.fillRect(0, 20, 10, 22); c.fillRect(80, 20, 10, 22);
    c.fillRect(0, 92, 10, 22); c.fillRect(80, 92, 10, 22);
    
    c.fillStyle = '#94a3b8';
    c.fillRect(2, 23, 6, 16); c.fillRect(82, 23, 6, 16);
    c.fillRect(2, 95, 6, 16); c.fillRect(82, 95, 6, 16);

    c.fillStyle = color;
    c.beginPath();
    c.moveTo(14, 35); c.bezierCurveTo(14, 16, 24, 6, 45, 6); c.bezierCurveTo(66, 6, 76, 16, 76, 35);
    c.lineTo(78, 96); c.bezierCurveTo(78, 112, 70, 122, 45, 122); c.bezierCurveTo(20, 122, 12, 112, 12, 96);
    c.closePath(); c.fill();
    c.lineWidth = 2; c.strokeStyle = '#090d16'; c.stroke();

    c.strokeStyle = 'rgba(0,0,0,0.15)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(25, 8); c.bezierCurveTo(32, 26, 36, 36, 45, 36); c.bezierCurveTo(54, 36, 58, 26, 65, 8); c.stroke();

    c.fillStyle = 'rgba(15,23,42,0.88)';
    c.beginPath();
    c.moveTo(20, 44); c.bezierCurveTo(22, 34, 30, 30, 45, 30); c.bezierCurveTo(60, 30, 68, 34, 70, 44);
    c.lineTo(72, 74); c.bezierCurveTo(72, 84, 66, 88, 45, 88); c.bezierCurveTo(24, 88, 18, 84, 18, 74);
    c.closePath(); c.fill(); c.strokeStyle = '#0f172a'; c.lineWidth = 1; c.stroke();

    c.strokeStyle = 'rgba(255,255,255,0.2)'; c.lineWidth = 2; c.beginPath(); c.moveTo(24, 42); c.quadraticCurveTo(32, 34, 45, 34); c.stroke();

    c.fillStyle = '#ffffff'; c.fillRect(14, 12, 12, 5); c.fillRect(64, 12, 12, 5);

    c.fillStyle = isPlayer ? '#ff1111' : '#ff4400';
    c.fillRect(16, 116, 16, 4); c.fillRect(58, 116, 16, 4);

    c.fillStyle = '#ffffff'; c.font = '900 9px sans-serif'; c.textAlign = 'center';
    c.fillText(name, 45, 64);

    vehicleCacheCanvases[key] = cacheCanvas;
}

function buildAllGraphicsCaches() {
    generateVehicleGraphicsCache('player', '#00e5ff', 'YOU', true);
    stageJobs.forEach((job, idx) => {
        generateVehicleGraphicsCache(job.key + '_' + idx, job.color, job.name, false);
    });
}
buildAllGraphicsCaches();

let score = 0;
let currentStageIndex = 0; 
let passedCarsCount = 0; 
let isPlaying = false;
let isPaused = false; 
let isBurning = false; 
let lastTime = 0;
let roadLinesY = 0;
let enemySpawnTimer = 0;
let enemies = [];
let particles = [];
let sceneryItems = [];
let lastSpawnLane = -1; 
let animationFrameId = null; 

let baseRoadSpeed = 560; 
let playerSpeed = 590;
let realGameStageLevel = 0; // Pure level counter tracking independent game acceleration

const player = {
    x: 250, y: 520, 
    width: 58, height: 84, 
    movingLeft: false, movingRight: false
};

function updateScoreUI() {
    sbPass.innerText = `PASS: ${passedCarsCount}/10`;
    sbScore.innerText = `SCORE: ${score}`;
    sbStage.innerText = `STAGE: ${realGameStageLevel + 1}`;
}

function checkStageProgression() {
    passedCarsCount++;
    if (passedCarsCount >= 10) {
        passedCarsCount = 0;
        
        // Dynamic Variable Rewards Cycle (Jobs, Colors, Roles shifts automatically)
        currentStageIndex = (currentStageIndex < stageJobs.length - 1) ? currentStageIndex + 1 : 0;
        
        // Acceleration engine increments fully separated from prizes setup
        realGameStageLevel++;
        baseRoadSpeed = 560 + (realGameStageLevel * 140);
        playerSpeed = 590 + (realGameStageLevel * 75);
        
        showRewardNotification("Congratulations! You won the awesome prize of this stage! 🔥");
    }
    updateScoreUI();
}

function showRewardNotification(text) {
    rewardToast.innerText = text;
    rewardToast.classList.add('show');
    playRewardSound();
    setTimeout(() => { rewardToast.classList.remove('show'); }, 3400);
}

function initScenery() {
    sceneryItems = [];
    // Tree generation density frequency cut down by half (Y delta moved from 120 to 245)
    for (let y = -100; y < canvas.height + 100; y += 245) {
        sceneryItems.push({ x: canvas.width * 0.035, y: y });
        sceneryItems.push({ x: canvas.width * 0.945, y: y + 110 });
    }
}

function updateAndDrawScenery(speed, dt) {
    ctx.fillStyle = '#1f442b';
    ctx.fillRect(0, 0, canvas.width * 0.08, canvas.height);
    ctx.fillRect(canvas.width * 0.92, 0, canvas.width * 0.08, canvas.height);

    const len = sceneryItems.length;
    ctx.fillStyle = '#22c55e';
    for(let i=0; i<len; i++) {
        const item = sceneryItems[i];
        if (isPlaying && !isPaused && !isBurning) item.y += speed * dt;
        if (item.y > canvas.height + 40) item.y = -40;

        ctx.beginPath(); ctx.moveTo(item.x, item.y + 10); ctx.lineTo(item.x - 10, item.y + 30); ctx.lineTo(item.x + 10, item.y + 30); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(item.x, item.y); ctx.lineTo(item.x - 7, item.y + 16); ctx.lineTo(item.x + 7, item.y + 16); ctx.closePath(); ctx.fill();
    }
}

class ExplodeParticle {
    constructor(x, y, isFire = false) {
        this.x = x; this.y = y; this.isFire = isFire;
        this.radius = isFire ? Math.random() * 6 + 2 : Math.random() * 2.5 + 1;
        
        const angle = Math.random() * Math.PI * 2;
        const speed = isFire ? Math.random() * 120 + 30 : Math.random() * 180 + 80;
        
        this.vx = Math.cos(angle) * speed; 
        this.vy = isFire ? (Math.sin(angle) * speed * 0.4) - 45 : Math.sin(angle) * speed; 
        
        this.alpha = 1;
        this.decay = isFire ? Math.random() * 0.9 + 0.9 : 1.6;
        
        if (isFire) {
            this.color = ['#d32f2f', '#f57c00', '#fbc02d', '#5c6bc0', '#212121'][Math.floor(Math.random() * 5)];
        } else {
            this.color = '#00e5ff';
        }
    }
    update(dt) { 
        this.x += this.vx * dt; 
        this.y += this.vy * dt; 
        this.alpha -= this.decay * dt; 
        if (this.isFire && this.radius > 0.4) this.radius -= 1.8 * dt; 
    }
    draw() {
        if (this.alpha <= 0) return;
        ctx.save(); 
        ctx.globalAlpha = this.alpha; 
        ctx.fillStyle = this.color;
        ctx.beginPath(); 
        ctx.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2); 
        ctx.fill(); 
        ctx.restore();
    }
}

class EnemyCar {
    constructor() {
        this.jobSpec = stageJobs[currentStageIndex];
        this.width = (this.jobSpec.type === 'BIG_SIZE') ? 66 : 58;
        this.height = (this.jobSpec.type === 'BIG_SIZE') ? 104 : 84;
        
        const lanes = [canvas.width * 0.23, canvas.width * 0.5, canvas.width * 0.77];
        let targetLaneIndex = Math.floor(Math.random() * lanes.length);
        if (targetLaneIndex === lastSpawnLane) {
            targetLaneIndex = (targetLaneIndex + 1) % lanes.length;
        }
        lastSpawnLane = targetLaneIndex;
        
        this.x = lanes[targetLaneIndex];
        this.y = -130;
        
        this.speed = baseRoadSpeed - 55 + (Math.random() * 60); 
        this.passed = false;
        this.cacheKey = this.jobSpec.key + '_' + currentStageIndex;
    }
    update(dt) { this.y += this.speed * dt; }
    draw() {
        const imgCache = vehicleCacheCanvases[this.cacheKey];
        if (imgCache) {
            ctx.drawImage(imgCache, this.x - this.width/2, this.y - this.height/2, this.width, this.height);
        }
    }
}

function handleEnemies(dt) {
    if (!isPaused && !isBurning) enemySpawnTimer += dt;
    
    let currentType = stageJobs[currentStageIndex].type;
    let baseInterval = (currentType === 'SPEED_OBSTACLE' || currentType === 'CHAOS') ? 0.42 : 0.80 - (realGameStageLevel * 0.09);
    const spawnInterval = Math.max(0.28, baseInterval);
    
    if (enemySpawnTimer > spawnInterval && !isPaused && !isBurning) {
        enemies.push(new EnemyCar());
        enemySpawnTimer = 0;
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        if (!isPaused && !isBurning) enemies[i].update(dt);
        enemies[i].draw();

        if (!enemies[i].passed && enemies[i].y > player.y + player.height / 2) {
            enemies[i].passed = true;
            score += 25;
            checkStageProgression();
        }

        if (enemies[i].y > canvas.height + 130) {
            enemies.splice(i, 1);
            continue;
        }

        if (!isBurning && intersects(player.x, player.y, player.width, player.height, enemies[i].x, enemies[i].y, enemies[i].width, enemies[i].height)) {
            triggerCarBurnEffect();
            return;
        }
    }
}

function intersects(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 - w1/2.3 < x2 + w2/2.3 && x1 + w1/2.3 > x2 - w2/2.3 && y1 - h1/2.3 < y2 + h2/2.3 && y1 + h1/2.3 > y2 - h2/2.3;
}

function triggerCarBurnEffect() {
    isBurning = true;
    player.movingLeft = false;
    player.movingRight = false;
    playMarioDeathSound();
    
    let burnCounter = 0;
    const burnInterval = setInterval(() => {
        for (let p = 0; p < 6; p++) {
            particles.push(new ExplodeParticle(player.x + (Math.random()*20 - 10), player.y + (Math.random()*26 - 13), true));
        }
        burnCounter++;
        if (burnCounter > 16) { 
            clearInterval(burnInterval);
            gameOver();
        }
    }, 45);
}

function drawRoad(dt) {
    ctx.fillStyle = '#171c24';
    ctx.fillRect(canvas.width * 0.08, 0, canvas.width * 0.84, canvas.height);

    const leftLimit = canvas.width * 0.08;
    const rightLimit = canvas.width * 0.92 - 6;

    updateAndDrawScenery(baseRoadSpeed, dt);

    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(leftLimit, 0, 6, canvas.height);
    ctx.fillRect(rightLimit, 0, 6, canvas.height);

    if (isPlaying && !isPaused && !isBurning) {
        if (player.x - player.width / 2 <= leftLimit + 6 || player.x + player.width / 2 >= rightLimit) {
            triggerCarBurnEffect();
            return;
        }
    }

    ctx.fillStyle = '#ffffff';
    if (!isPaused && !isBurning) roadLinesY = (roadLinesY + baseRoadSpeed * dt) % 70;

    for (let y = roadLinesY - 70; y < canvas.height; y += 70) {
        ctx.fillRect(canvas.width * 0.38 - 1.5, y, 3, 35);
        ctx.fillRect(canvas.width * 0.62 - 1.5, y, 3, 35);
    }
}

function startCountdown() {
    welcomeScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    pauseBtn.style.display = 'none';
    countdownOverlay.style.display = 'flex';
    
    let states = ['3', '2', '1'];
    let current = 0;

    function nextTick() {
        if (current < states.length) {
            // Completely static, no layout-thrashing class updates
            countdownText.innerText = states[current];
            current++;
            setTimeout(nextTick, 850);
        } else {
            countdownOverlay.style.display = 'none';
            playBeep();
            isPlaying = true; isPaused = false; isBurning = false;
            pauseBtn.innerText = "Pause"; pauseBtn.style.display = 'block';
            lastTime = performance.now();
            musicTimer = 0; musicStep = 0;
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(loop);
        }
    }
    nextTick();
}

pauseBtn.addEventListener('click', () => {
    if (isBurning) return;
    isPaused = !isPaused;
    pauseBtn.innerText = isPaused ? "Resume" : "Pause";
    if (!isPaused) { 
        lastTime = performance.now(); 
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        animationFrameId = requestAnimationFrame(loop); 
    }
});

function gameOver() { 
    isPlaying = false; 
    pauseBtn.style.display = 'none'; 
    if (animationFrameId) cancelAnimationFrame(animationFrameId);
    gameOverScreen.style.display = 'flex'; 
}

function resetGame() {
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    score = 0; currentStageIndex = 0; passedCarsCount = 0; lastSpawnLane = -1;
    realGameStageLevel = 0;
    baseRoadSpeed = 560;
    playerSpeed = 590;
    isBurning = false;
    player.movingLeft = false;
    player.movingRight = false;
    updateScoreUI();
    
    resizeCanvas();
    player.x = canvas.width / 2; player.y = 520; 
    enemies = []; particles = []; enemySpawnTimer = -0.1;
    initScenery();
    startCountdown();
}

function loop(currentTime) {
    if (!isPlaying || isPaused) return;

    let dt = (currentTime - lastTime) / 1000;
    if (dt > 0.05) dt = 0.016; 
    lastTime = currentTime;

    processInlineMusic(dt);

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawRoad(dt);

    if (isPlaying && !isPaused && !isBurning) {
        if (player.movingLeft) player.x -= playerSpeed * dt;
        if (player.movingRight) player.x += playerSpeed * dt;
    }

    if (!isBurning) {
        const pCache = vehicleCacheCanvases['player'];
        if (pCache) {
            ctx.drawImage(pCache, player.x - player.width/2, player.y - player.height/2, player.width, player.height);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt); particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    handleEnemies(dt);
    if (isPlaying && !isPaused) animationFrameId = requestAnimationFrame(loop);
}

const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

btnLeft.addEventListener('mousedown', (e) => { if(!isPaused && !isBurning) { player.movingLeft = true; player.movingRight = false; playClickSound(); } });
btnLeft.addEventListener('mouseup', () => player.movingLeft = false);
btnLeft.addEventListener('mouseleave', () => player.movingLeft = false);
btnLeft.addEventListener('touchstart', (e) => { 
    if (e.cancelable) e.preventDefault(); 
    if(!isPaused && !isBurning) { player.movingLeft = true; player.movingRight = false; playClickSound(); } 
}, { passive: false });
btnLeft.addEventListener('touchend', (e) => {
    if (e.cancelable) e.preventDefault();
    player.movingLeft = false;
}, { passive: false });

btnRight.addEventListener('mousedown', (e) => { if(!isPaused && !isBurning) { player.movingRight = true; player.movingLeft = false; playClickSound(); } });
btnRight.addEventListener('mouseup', () => player.movingRight = false);
btnRight.addEventListener('mouseleave', () => player.movingRight = false);
btnRight.addEventListener('touchstart', (e) => { 
    if (e.cancelable) e.preventDefault(); 
    if(!isPaused && !isBurning) { player.movingRight = true; player.movingLeft = false; playClickSound(); } 
}, { passive: false });
btnRight.addEventListener('touchend', (e) => {
    if (e.cancelable) e.preventDefault();
    player.movingRight = false;
}, { passive: false });

startBtn.addEventListener('click', resetGame);
restartBtn.addEventListener('click', resetGame);

window.addEventListener('load', () => {
    resizeCanvas();
    player.x = canvas.width / 2; player.y = 520;
    initScenery();
});
</script>

</body>
</html>
