<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Track - Classic Neon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030508;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: #0b0d13;
            overflow: hidden;
            border: 1px solid rgba(0, 229, 255, 0.1);
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            transform: translate3d(0,0,0);
            -webkit-transform: translate3d(0,0,0);
        }
        
        #topBar {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 6;
            pointer-events: none;
        }
        #scoreBoard {
            color: #ffffff;
            font-size: 12px; 
            font-weight: 900;
            background: rgba(10, 15, 26, 0.85);
            border: 2px solid #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 10px; 
            flex-grow: 1;
            text-shadow: 0 0 8px #00e5ff;
        }
        .sb-item {
            white-space: nowrap;
            letter-spacing: 1px;
        }
        .pause-btn {
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 900;
            color: #ffffff;
            background: rgba(10, 15, 26, 0.9);
            border: 2px solid #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            cursor: pointer;
            pointer-events: auto;
            display: none;
            margin-left: 12px; 
            white-space: nowrap;
            text-transform: uppercase;
            text-shadow: 0 0 5px #00e5ff;
        }

        #controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            position: absolute;
            bottom: 40px; 
            padding: 0 40px;
            pointer-events: none;
            z-index: 5;
        }
        .btn {
            width: 85px;
            height: 85px;
            border: 3px solid #00e5ff;
            border-radius: 50%;
            color: #ffffff;
            font-size: 36px;
            background: rgba(0, 229, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.1);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            text-shadow: 0 0 10px #00e5ff;
        }
        .btn:active {
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.6);
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: #06080c;
        }
        
        #welcomeScreen { background: #04060a; display: none; }
        .welcome-title {
            color: #00e5ff;
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.7), 0 0 40px rgba(0, 229, 255, 0.4);
        }
        
        #gameOverScreen { background: rgba(4, 6, 10, 0.95); display: none; }
        .game-over-title {
            color: #ff2255;
            font-size: 46px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(255, 34, 85, 0.7), 0 0 40px rgba(255, 34, 85, 0.4);
        }
        
        .menu-btn {
            padding: 16px 60px;
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
            background: #0b0f17;
            border: 2.5px solid #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            border-radius: 35px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00e5ff;
        }
        #restartBtn { 
            border-color: #ff2255; 
            box-shadow: 0 0 15px rgba(255, 34, 85, 0.4);
            text-shadow: 0 0 5px #ff2255;
        }

        #countdownOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(3, 5, 8, 0.9);
            z-index: 9;
        }
        #countdownText {
            font-size: 240px; 
            font-weight: 900;
            color: #00ffff; 
            opacity: 0;
            text-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff, 0 0 8px #ffffff;
            transform: scale(0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-out;
        }
        #countdownText.animate {
            transform: scale(1.1);
            opacity: 1;
        }

        #rewardToast {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) scale(0.85);
            background: #10b981;
            border: 2px solid #34d399;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            color: #ffffff;
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 900;
            border-radius: 20px;
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            width: 85%;
            direction: rtl;
        }
        #rewardToast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        #authErrorScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #040609;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 30px;
            text-align: center;
        }
        .error-card {
            background: rgba(11, 16, 27, 0.9);
            border: 2px solid #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.4);
            border-radius: 30px;
            padding: 50px 35px;
            max-width: 420px;
            width: 100%;
        }
        .error-icon {
            font-size: 65px;
            margin-bottom: 25px;
        }
        .error-title-en {
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 8px #ef4444;
        }
        .error-desc-en {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="authErrorScreen">
        <div class="error-card">
            <div class="error-icon">🔒</div>
            <div class="error-title-en">Access Denied</div>
            <div class="error-desc-en">You do not have permission to enter the game</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="topBar">
        <div id="scoreBoard">
            <span class="sb-item" id="sbPass">PASS: 0/10</span>
            <span class="sb-item" id="sbScore">SCORE: 0</span>
            <span class="sb-item" id="sbStage">STAGE: 1</span>
        </div>
        <button id="pauseBtn" class="pause-btn">Pause</button>
    </div>

    <div id="rewardToast">تبریک! شما جایزه ی خفن این مرحله رو بردید!</div>
    
    <div id="controls">
        <button id="btnLeft" class="btn">◀</button>
        <button id="btnRight" class="btn">▶</button>
    </div>

    <div id="welcomeScreen" class="screen-overlay">
        <div class="welcome-title">TURBO TRACK</div>
        <button id="startBtn" class="menu-btn">Start Race</button>
    </div>

    <div id="gameOverScreen" class="screen-overlay">
        <div class="game-over-title">GAME OVER</div>
        <button id="restartBtn" class="menu-btn">Race Again</button>
    </div>

    <div id="countdownOverlay">
        <div id="countdownText">3</div>
    </div>
</div>

<script>
// --- لیست سفید کاربران مجاز تلگرام ---
const ALLOWED_USERS = [
    2049044424,         
    "your_username"    
];

function verifyTelegramAccess() {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const authErrorScreen = document.getElementById('authErrorScreen');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const user = tg.initDataUnsafe?.user;

    if (!tg.initData || !user) {
        authErrorScreen.style.display = 'none';
        welcomeScreen.style.display = 'flex';
        return;
    }

    const currentUserId = user.id ? Number(user.id) : null;
    const currentUsername = user.username ? user.username.toLowerCase().trim() : "";

    const isAllowed = ALLOWED_USERS.some(allowed => {
        if (typeof allowed === 'number' && currentUserId !== null) {
            return allowed === currentUserId;
        }
        if (typeof allowed === 'string' && currentUsername !== "") {
            let cleanAllowed = allowed.toLowerCase().replace('@', '').trim();
            return cleanAllowed === currentUsername;
        }
        return false;
    });

    if (isAllowed) {
        authErrorScreen.style.display = 'none';
        welcomeScreen.style.display = 'flex';
    } else {
        authErrorScreen.style.display = 'flex';
        welcomeScreen.style.display = 'none';
    }
}

verifyTelegramAccess();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 

const welcomeScreen = document.getElementById('welcomeScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const countdownOverlay = document.getElementById('countdownOverlay');
const countdownText = document.getElementById('countdownText');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');

const sbPass = document.getElementById('sbPass');
const sbScore = document.getElementById('sbScore');
const sbStage = document.getElementById('sbStage');
const rewardToast = document.getElementById('rewardToast');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
resizeCanvas();

const player = {
    x: canvas.width / 2,
    y: 520,
    width: 52,
    height: 84,
    movingLeft: false,
    movingRight: false,
    speed: 580 
};

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let musicInterval = null;
let musicStep = 0;

const luxuryMelody = [
    185, 0, 220, 0, 185, 185, 246, 0,
    220, 0, 185, 0, 220, 246, 185, 0
];

function playSoundEffect(freq, duration, vol, type = 'sine', delay = 0) {
    if (isPaused) return; 
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.linearRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.01);
}

function playMusicNode() {
    if (!isPlaying || isPaused || isBurning) return; 
    const freq = luxuryMelody[musicStep % luxuryMelody.length];
    musicStep++;
    if (freq === 0) return;
    playSoundEffect(freq, 0.18, 0.45, 'triangle'); 
}

function startMusic() { stopMusic(); musicStep = 0; musicInterval = setInterval(playMusicNode, 180); } 
function stopMusic() { if (musicInterval) { clearInterval(musicInterval); musicInterval = null; } }
function playClickSound() { playSoundEffect(800, 0.02, 0.3, 'sine'); }
function playMarioDeathSound() {
    const mNotes = [440, 392, 349, 293];
    const timings = [0.0, 0.06, 0.12, 0.18]; 
    const durations = [0.05, 0.05, 0.05, 0.15]; 
    mNotes.forEach((freq, idx) => {
        playSoundEffect(freq, durations[idx], 0.45, 'sawtooth', timings[idx]);
    });
}
function playBeep() { playSoundEffect(550, 0.08, 0.45, 'sine'); }
function playRewardSound() {
    [523, 659, 784].forEach((f, i) => {
        playSoundEffect(f, 0.08, 0.45, 'sine', i * 0.06);
    });
}

const stageJobs = [
    { key: 'ambulance', name: 'AMBU', type: 'STANDARD', color: '#ff2a55' },
    { key: 'taxi', name: 'TAXI', type: 'STANDARD', color: '#facc15' },
    { key: 'police', name: 'POLICE', type: 'SPEED_OBSTACLE', color: '#2b66ff' }, 
    { key: 'motor', name: 'MOTO', type: 'BIKE', color: '#10b981' },     
    { key: 'bicycle', name: 'BIKE', type: 'BIKE', color: '#ec4899' },     
    { key: 'racecar', name: 'RACE', type: 'SPEED_OBSTACLE', color: '#f97316' },       
    { key: 'personal', name: 'CAR', type: 'STANDARD', color: '#a855f7' },             
    { key: 'truck', name: 'TRUCK', type: 'BIG_SIZE', color: '#3b82f6' },             
    { key: 'garbage', name: 'GARB', type: 'BIG_SIZE', color: '#059669' },             
    { key: 'fire', name: 'FIRE', type: 'CHAOS', color: '#dc2626' }             
];

const carCache = {};

// بازگشت کامل به دکوراسیون و استایل پرمیوم خودروی تصویر دوم
function preRenderVehicleToCache(color, name, type, width, height, cacheKey) {
    const offCanvas = document.createElement('canvas');
    offCanvas.width = width + 30;
    offCanvas.height = height + 30;
    const octx = offCanvas.getContext('2d');
    
    octx.translate(offCanvas.width / 2, offCanvas.height / 2);

    const isBike = (type === 'BIKE');
    const bodyW = isBike ? width * 0.55 : width * 0.92;
    const bodyH = height;

    octx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    octx.shadowBlur = 10;
    octx.shadowOffsetY = 6;

    if (!isBike) {
        const tW = 10;
        const tH = 22;
        const offX = width / 2 + 1;
        const offY = height / 2 - 14;

        const drawTireWithTreads = (tx, ty) => {
            octx.save();
            octx.shadowBlur = 0; octx.shadowOffsetY = 0;
            octx.fillStyle = '#1e293b';
            octx.fillRect(tx, ty, tW, tH);
            octx.strokeRect(tx, ty, tW, tH);
            octx.strokeStyle = '#475569';
            octx.lineWidth = 1;
            for (let lineY = ty + 3; lineY < ty + tH; lineY += 4) {
                octx.beginPath(); octx.moveTo(tx, lineY); octx.lineTo(tx + tW, lineY); octx.stroke();
            }
            octx.restore();
        };

        drawTireWithTreads(-offX - 3, -offY);       
        drawTireWithTreads(offX - 7, -offY);        
        drawTireWithTreads(-offX - 3, offY - 4);    
        drawTireWithTreads(offX - 7, offY - 4);     
    } else {
        octx.fillStyle = '#1e293b';
        octx.fillRect(-3, -bodyH/2 + 4, 6, 18);
        octx.fillRect(-3, bodyH/2 - 22, 6, 18);
    }

    let bodyGrad = octx.createLinearGradient(-bodyW/2, 0, bodyW/2, 0);
    bodyGrad.addColorStop(0, color);
    bodyGrad.addColorStop(0.3, color);
    bodyGrad.addColorStop(0.5, '#ffffff'); 
    bodyGrad.addColorStop(0.7, color);
    bodyGrad.addColorStop(1, '#0f172a');

    octx.fillStyle = bodyGrad;
    octx.beginPath();
    octx.moveTo(-bodyW / 2, -bodyH / 2 + 16);
    octx.bezierCurveTo(-bodyW / 2, -bodyH / 2 - 4, bodyW / 2, -bodyH / 2 - 4, bodyW / 2, -bodyH / 2 + 16);
    octx.lineTo(bodyW / 2, bodyH / 2 - 16);
    octx.bezierCurveTo(bodyW / 2, bodyH / 2 + 6, -bodyW / 2, bodyH / 2 + 6, -bodyW / 2, bodyH / 2 - 16);
    octx.closePath();
    octx.fill();

    octx.strokeStyle = '#0f172a';
    octx.lineWidth = 2;
    octx.stroke();

    octx.save();
    octx.shadowBlur = 0; octx.shadowOffsetY = 0;
    octx.strokeStyle = 'rgba(255,255,255,0.25)';
    octx.lineWidth = 1.5;
    octx.beginPath();
    octx.moveTo(-bodyW/3, -bodyH/2 + 4); octx.lineTo(-bodyW/6, -bodyH/4);
    octx.moveTo(bodyW/3, -bodyH/2 + 4); octx.lineTo(bodyW/6, -bodyH/4);
    octx.stroke();

    const winW = bodyW * 0.78;
    const winH = bodyH * 0.50;
    const winY = -bodyH * 0.08;

    let winGrad = octx.createLinearGradient(0, winY, 0, winY + winH);
    winGrad.addColorStop(0, '#1e293b');
    winGrad.addColorStop(1, '#0f172a');
    octx.fillStyle = winGrad;
    
    octx.beginPath();
    octx.moveTo(-winW / 2, winY + 14);
    octx.bezierCurveTo(-winW / 2, winY - 4, winW / 2, winY - 4, winW / 2, winY + 14);
    octx.bezierCurveTo(winW / 2, winY + winH, -winW / 2, winY + winH, -winW / 2, winY + 14);
    octx.closePath();
    octx.fill();
    octx.strokeStyle = '#090d16';
    octx.lineWidth = 2;
    octx.stroke();

    if (!isBike) {
        octx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        octx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        octx.lineWidth = 1;
        octx.beginPath(); octx.ellipse(-bodyW/2 + 6, -bodyH/2 + 8, 5, 8, -Math.PI/6, 0, Math.PI*2); octx.fill(); octx.stroke();
        octx.beginPath(); octx.ellipse(bodyW/2 - 6, -bodyH/2 + 8, 5, 8, Math.PI/6, 0, Math.PI*2); octx.fill(); octx.stroke();

        octx.strokeStyle = '#ff003c';
        octx.lineWidth = 3.5;
        octx.lineCap = 'round';
        octx.beginPath(); octx.moveTo(-bodyW/2 + 5, bodyH/2 - 4); octx.quadraticCurveTo(-bodyW/3, bodyH/2 - 2, -bodyW/4, bodyH/2 - 4); octx.stroke();
        octx.beginPath(); octx.moveTo(bodyW/2 - 5, bodyH/2 - 4); octx.quadraticCurveTo(bodyW/3, bodyH/2 - 2, bodyW/4, bodyH/2 - 4); octx.stroke();
    }

    octx.fillStyle = '#ffffff';
    octx.font = '900 12px sans-serif';
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(name, 0, winY + winH / 2);
    octx.restore();

    carCache[cacheKey] = offCanvas;
}

function generateAllCarCaches() {
    preRenderVehicleToCache('#00e5ff', 'YOU', 'STANDARD', player.width, player.height, 'player_car');
    
    stageJobs.forEach(job => {
        const w = (job.type === 'BIG_SIZE') ? 54 : (job.type === 'BIKE' ? 28 : 48);
        const h = (job.type === 'BIG_SIZE') ? 92 : 76;
        preRenderVehicleToCache(job.color, job.name, job.type, w, h, `enemy_${job.key}`);
    });
}

let score = 0;
let currentStageIndex = 0; 
let passedCarsCount = 0; 
let isPlaying = false;
let isPaused = false; 
let isBurning = false; 
let lastTime = 0;
let roadLinesY = 0;
let enemySpawnTimer = 0;
let enemies = [];
let particles = [];
let sceneryItems = [];
let lastSpawnLane = -1; 

// تنظیم سرعت پایه بازی جهت افزایش تدریجی آن در مراحل بالاتر
let currentRoadSpeed = 500; 
let speedMultiplierPerStage = 80; 

function updateScoreUI() {
    sbPass.innerText = `PASS: ${passedCarsCount}/10`;
    sbScore.innerText = `SCORE: ${score}`;
    sbStage.innerText = `STAGE: ${currentStageIndex + 1}`;
}

function checkStageProgression() {
    passedCarsCount++;
    if (passedCarsCount >= 10) {
        passedCarsCount = 0;
        currentStageIndex = (currentStageIndex < stageJobs.length - 1) ? currentStageIndex + 1 : 0;
        // فرمول افزایش پله‌پله و تدریجی سرعت بعد از عبور از هر مرحله
        currentRoadSpeed = 500 + (currentStageIndex * speedMultiplierPerStage);
        showRewardNotification("تبریک! شما جایزه ی خفن این مرحله رو بردید!");
    }
    updateScoreUI();
}

function showRewardNotification(text) {
    rewardToast.innerText = text;
    rewardToast.classList.add('show');
    playRewardSound();
    setTimeout(() => { rewardToast.classList.remove('show'); }, 2500);
}

// بازگشت به سیستم درخت‌های کلاسیک و فانتزی کناره جاده
function initScenery() {
    sceneryItems = [];
    for (let y = -100; y < canvas.height + 100; y += 120) {
        sceneryItems.push({ x: canvas.width * 0.04, y: y });
        sceneryItems.push({ x: canvas.width * 0.96, y: y + 60 });
    }
}

function updateAndDrawScenery(speed, dt) {
    ctx.fillStyle = '#0f2416';
    ctx.fillRect(0, 0, canvas.width * 0.08, canvas.height);
    ctx.fillRect(canvas.width * 0.92, 0, canvas.width * 0.08, canvas.height);

    const len = sceneryItems.length;
    ctx.fillStyle = '#10b981';
    for(let i=0; i<len; i++) {
        const item = sceneryItems[i];
        if (isPlaying && !isPaused && !isBurning) item.y += speed * dt;
        if (item.y > canvas.height + 40) item.y = -40;

        // ترسیم مستقیم درخت‌های فانتزی شیک و پایدار
        ctx.beginPath(); 
        ctx.moveTo(item.x, item.y + 8); 
        ctx.lineTo(item.x - 7, item.y + 22); 
        ctx.lineTo(item.x + 7, item.y + 22); 
        ctx.closePath(); 
        ctx.fill();
    }
}

class ExplodeParticle {
    constructor(x, y, isFire = false) {
        this.x = x; this.y = y; this.isFire = isFire;
        this.radius = isFire ? Math.random() * 4 + 2 : Math.random() * 2 + 1;
        const angle = Math.random() * Math.PI * 2;
        const speed = isFire ? Math.random() * 110 + 30 : Math.random() * 160 + 70;
        this.vx = Math.cos(angle) * speed; 
        this.vy = isFire ? (Math.sin(angle) * speed * 0.4) - 40 : Math.sin(angle) * speed; 
        this.alpha = 1;
        this.decay = isFire ? Math.random() * 0.9 + 1.0 : 1.8;
        this.color = isFire ? ['#ff2255', '#ff6600', '#facc15'][Math.floor(Math.random() * 3)] : '#00e5ff';
    }
    update(dt) { 
        this.x += this.vx * dt; 
        this.y += this.vy * dt; 
        this.alpha -= this.decay * dt; 
    }
    draw() {
        if (this.alpha <= 0) return;
        ctx.save(); 
        ctx.globalAlpha = this.alpha; 
        ctx.fillStyle = this.color;
        ctx.beginPath(); 
        ctx.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2); 
        ctx.fill(); 
        ctx.restore();
    }
}

function drawCachedVehicle(x, y, cacheKey) {
    const img = carCache[cacheKey];
    if (img) {
        ctx.drawImage(img, Math.round(x - img.width / 2), Math.round(y - img.height / 2));
    }
}

class EnemyCar {
    constructor() {
        this.jobSpec = stageJobs[currentStageIndex];
        this.width = (this.jobSpec.type === 'BIG_SIZE') ? 54 : (this.jobSpec.type === 'BIKE' ? 28 : 48);
        this.height = (this.jobSpec.type === 'BIG_SIZE') ? 92 : 76;
        
        const lanes = [canvas.width * 0.23, canvas.width * 0.5, canvas.width * 0.77];
        let targetLaneIndex = Math.floor(Math.random() * lanes.length);
        if (targetLaneIndex === lastSpawnLane) {
            targetLaneIndex = (targetLaneIndex + 1) % lanes.length;
        }
        lastSpawnLane = targetLaneIndex;
        
        this.x = lanes[targetLaneIndex];
        this.y = -120;
        this.speed = currentRoadSpeed; 
        this.passed = false;
        this.cacheKey = `enemy_${this.jobSpec.key}`;
    }
    update(dt) { this.y += this.speed * dt; }
    draw() {
        drawCachedVehicle(this.x, this.y, this.cacheKey);
    }
}

function handleEnemies(dt) {
    if (!isPaused && !isBurning) enemySpawnTimer += dt;
    
    let baseInterval = 0.85 - (currentStageIndex * 0.08);
    const spawnInterval = Math.max(0.26, baseInterval); 
    
    if (enemySpawnTimer > spawnInterval && !isPaused && !isBurning) {
        enemies.push(new EnemyCar());
        enemySpawnTimer = 0;
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        if (!isPaused && !isBurning) enemies[i].update(dt);
        enemies[i].draw();

        if (!enemies[i].passed && enemies[i].y > player.y + player.height / 2) {
            enemies[i].passed = true;
            score += 25;
            checkStageProgression();
        }

        if (enemies[i].y > canvas.height + 120) {
            enemies.splice(i, 1);
            continue;
        }

        if (!isBurning && intersects(player.x, player.y, player.width, player.height, enemies[i].x, enemies[i].y, enemies[i].width, enemies[i].height)) {
            triggerCarBurnEffect();
            return;
        }
    }
}

function intersects(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 - w1/2.4 < x2 + w2/2.4 && x1 + w1/2.4 > x2 - w2/2.4 && y1 - h1/2.4 < y2 + h2/2.4 && y1 + h1/2.4 > y2 - h2/2.4;
}

function triggerCarBurnEffect() {
    isBurning = true;
    stopMusic(); 
    playMarioDeathSound();
    
    let burnCounter = 0;
    const burnInterval = setInterval(() => {
        for (let p = 0; p < 4; p++) {
            particles.push(new ExplodeParticle(player.x + (Math.random()*12 - 6), player.y + (Math.random()*16 - 8), true));
        }
        burnCounter++;
        if (burnCounter > 12) { 
            clearInterval(burnInterval);
            gameOver();
        }
    }, 50);
}

// بازگشت به سیستم اصلی و روان ترسیم جاده با راندمان بالا
function drawRoad(dt) {
    ctx.fillStyle = '#111622';
    ctx.fillRect(canvas.width * 0.08, 0, canvas.width * 0.84, canvas.height);

    const leftLimit = canvas.width * 0.08;
    const rightLimit = canvas.width * 0.92 - 6;

    updateAndDrawScenery(currentRoadSpeed, dt);

    ctx.fillStyle = '#ff3b30';
    ctx.fillRect(leftLimit, 0, 5, canvas.height);
    ctx.fillRect(rightLimit, 0, 5, canvas.height);

    if (isPlaying && !isPaused && !isBurning) {
        if (player.x - player.width / 2 <= leftLimit + 5 || player.x + player.width / 2 >= rightLimit) {
            triggerCarBurnEffect();
            return;
        }
    }

    ctx.fillStyle = 'rgba(0, 229, 255, 0.4)';
    if (!isPaused && !isBurning) roadLinesY = (roadLinesY + currentRoadSpeed * dt) % 65;

    for (let y = roadLinesY - 65; y < canvas.height; y += 65) {
        ctx.fillRect(canvas.width * 0.38 - 1, Math.round(y), 2, 30);
        ctx.fillRect(canvas.width * 0.62 - 1, Math.round(y), 2, 30);
    }
}

function startCountdown() {
    welcomeScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    pauseBtn.style.display = 'none';
    countdownOverlay.style.display = 'flex';
    
    let states = ['3', '2', '1'];
    let current = 0;

    function nextTick() {
        if (current < states.length) {
            countdownText.innerText = states[current];
            countdownText.classList.remove('animate');
            void countdownText.offsetWidth; 
            countdownText.classList.add('animate');
            current++;
            setTimeout(nextTick, 800);
        } else {
            countdownOverlay.style.display = 'none';
            playBeep();
            isPlaying = true; isPaused = false; isBurning = false;
            pauseBtn.innerText = "Pause"; pauseBtn.style.display = 'block';
            lastTime = performance.now();
            startMusic(); 
            requestAnimationFrame(loop);
        }
    }
    nextTick();
}

pauseBtn.addEventListener('click', () => {
    if (isBurning) return;
    isPaused = !isPaused;
    pauseBtn.innerText = isPaused ? "Resume" : "Pause";
    if (!isPaused) { lastTime = performance.now(); requestAnimationFrame(loop); }
});

function gameOver() { 
    isPlaying = false; 
    pauseBtn.style.display = 'none'; 
    gameOverScreen.style.display = 'flex'; 
}

function resetGame() {
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    stopMusic(); 
    score = 0; currentStageIndex = 0; passedCarsCount = 0; lastSpawnLane = -1;
    currentRoadSpeed = 500; // ریست سرعت پایه اول بازی
    isBurning = false;
    updateScoreUI();
    
    resizeCanvas();
    player.x = canvas.width / 2; 
    player.y = 520; 
    enemies = []; particles = []; enemySpawnTimer = -0.1;
    initScenery();
    startCountdown();
}

function loop(currentTime) {
    if (!isPlaying || isPaused) return;

    let dt = (currentTime - lastTime) / 1000;
    if (dt > 0.04) dt = 0.04; 
    lastTime = currentTime;

    ctx.fillStyle = '#030508';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    drawRoad(dt);

    if (isPlaying && !isPaused && !isBurning) {
        // بازگشت به سیستم پاسخ‌دهی مستقیم و فوق‌العاده سریع دکمه‌ها بدون تاخیر
        if (player.movingLeft) player.x -= player.speed * dt;
        if (player.movingRight) player.x += player.speed * dt;
    }

    if (!isBurning) {
        drawCachedVehicle(player.x, player.y, 'player_car');
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt); particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    handleEnemies(dt);
    if (isPlaying && !isPaused) requestAnimationFrame(loop);
}

const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

// بازگشت کامل به کدهای تاچ پایداری که هیچ لگی روی موبایل ایجاد نمی‌کردند
btnLeft.addEventListener('touchstart', (e) => { 
    e.preventDefault(); 
    if(!isPaused && !isBurning) { player.movingLeft = true; playClickSound(); } 
}, { passive: false });
btnLeft.addEventListener('touchend', (e) => {
    e.preventDefault();
    player.movingLeft = false;
}, { passive: false });

btnRight.addEventListener('touchstart', (e) => { 
    e.preventDefault(); 
    if(!isPaused && !isBurning) { player.movingRight = true; playClickSound(); } 
}, { passive: false });
btnRight.addEventListener('touchend', (e) => {
    e.preventDefault();
    player.movingRight = false;
}, { passive: false });

// کنترلر دسکتاپ (ماوس)
btnLeft.addEventListener('mousedown', (e) => { if(!isPaused && !isBurning) { player.movingLeft = true; } });
btnLeft.addEventListener('mouseup', () => player.movingLeft = false);
btnLeft.addEventListener('mouseleave', () => player.movingLeft = false);
btnRight.addEventListener('mousedown', (e) => { if(!isPaused && !isBurning) { player.movingRight = true; } });
btnRight.addEventListener('mouseup', () => player.movingRight = false);
btnRight.addEventListener('mouseleave', () => player.movingRight = false);

startBtn.addEventListener('click', resetGame);
restartBtn.addEventListener('click', resetGame);

window.addEventListener('load', () => {
    resizeCanvas();
    generateAllCarCaches(); 
    player.x = canvas.width / 2;
    player.y = 520;
    initScenery();
});
</script>
