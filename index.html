<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Track - Lag Free Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #05070a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: #0f1319;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #topBar {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 6;
            pointer-events: none;
        }
        #scoreBoard {
            color: #ffffff;
            font-size: 11px; 
            font-weight: 800;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            background: rgba(15, 21, 32, 0.88);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 10px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            gap: 14px; 
            padding: 8px 14px; 
            flex-grow: 1;
        }
        .sb-item {
            white-space: nowrap;
        }
        .pause-btn {
            padding: 7px 15px;
            font-size: 11px;
            font-weight: 800;
            color: #ffffff;
            background: rgba(15, 21, 32, 0.9);
            border: 1px solid #00e5ff;
            border-radius: 10px;
            cursor: pointer;
            pointer-events: auto;
            display: none;
            margin-left: 10px; 
            white-space: nowrap;
        }

        #controls {
            display: flex;
            justify-content: center;
            gap: 80px;
            align-items: center;
            width: 100%;
            position: absolute;
            bottom: 60px; 
            padding: 0 25px;
            pointer-events: none;
            z-index: 5;
        }
        .btn {
            width: 85px;
            height: 85px;
            border: 3px solid rgba(0, 229, 255, 0.4);
            border-radius: 50%;
            color: #00e5ff;
            font-size: 36px;
            background: rgba(15, 21, 32, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.15);
        }
        .btn:active {
            background: rgba(0, 229, 255, 0.3);
            color: #ffffff;
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        
        #welcomeScreen { background: #07090e; display: none; }
        .welcome-title {
            color: #00e5ff;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-shadow: 0 0 25px rgba(0, 229, 255, 0.5);
        }
        
        #gameOverScreen { background: rgba(7, 9, 14, 0.96); display: none; }
        .game-over-title {
            color: #ff2222;
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 40px;
            text-shadow: 0 0 25px rgba(255, 34, 34, 0.5);
        }
        
        .menu-btn {
            padding: 15px 50px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background: #11151d;
            border: 2px solid #00e5ff;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
        }
        #restartBtn { border-color: #ff2222; }

        #countdownOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(5, 7, 10, 0.85);
            z-index: 9;
        }
        #countdownText {
            font-size: 180px; 
            font-weight: 900;
            color: #facc15; 
            text-shadow: 0 0 40px rgba(250, 204, 21, 0.5);
        }

        #rewardToast {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%) scale(0.85);
            background: #facc15;
            color: #000000;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(250, 204, 21, 0.5);
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            text-align: center;
            width: 88%;
            direction: rtl;
        }
        #rewardToast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        #authLockScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #06080c;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }
        .lock-card {
            background: rgba(15, 20, 30, 0.95);
            border: 2px solid #ef4444;
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
        }
        .lock-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }
        .lock-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .lock-desc {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="authLockScreen">
        <div class="lock-card">
            <div class="lock-icon">🔒</div>
            <div class="lock-title">Access Denied</div>
            <div class="lock-desc">You do not have permission to play this game.</div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="topBar">
        <div id="scoreBoard">
            <span class="sb-item" id="sbPass">PASS: 0/10</span>
            <span class="sb-item" id="sbScore">SCORE: 0</span>
            <span class="sb-item" id="sbStage">STAGE: 1</span>
        </div>
        <button id="pauseBtn" class="pause-btn">Pause</button>
    </div>

    <div id="rewardToast">جایزه جدید!</div>
    
    <div id="controls">
        <button id="btnLeft" class="btn">◀</button>
        <button id="btnRight" class="btn">▶</button>
    </div>

    <div id="welcomeScreen" class="screen-overlay">
        <div class="welcome-title">TURBO TRACK</div>
        <button id="startBtn" class="menu-btn">Start Race</button>
    </div>

    <div id="gameOverScreen" class="screen-overlay">
        <div class="game-over-title">GAME OVER</div>
        <button id="restartBtn" class="menu-btn">Race Again</button>
    </div>

    <div id="countdownOverlay">
        <div id="countdownText">3</div>
    </div>
</div>

<script>
const ALLOWED_USERS = [
    2049044424,         
    "your_username"    
];

function checkTelegramAuthorization() {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const authLockScreen = document.getElementById('authLockScreen');
    const welcomeScreen = document.getElementById('welcomeScreen');
    const user = tg.initDataUnsafe?.user;

    if (!tg.initData || !user) {
        authLockScreen.style.display = 'none';
        welcomeScreen.style.display = 'flex';
        return;
    }

    const userId = user.id ? Number(user.id) : null;
    const username = user.username ? user.username.toLowerCase().trim() : "";

    const hasAccess = ALLOWED_USERS.some(item => {
        if (typeof item === 'number' && userId !== null) {
            return item === userId;
        }
        if (typeof item === 'string' && username !== "") {
            return item.toLowerCase().replace('@', '').trim() === username;
        }
        return false;
    });

    if (hasAccess) {
        authLockScreen.style.display = 'none';
        welcomeScreen.style.display = 'flex';
    } else {
        authLockScreen.style.display = 'flex';
        welcomeScreen.style.display = 'none';
    }
}

checkTelegramAuthorization();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const welcomeScreen = document.getElementById('welcomeScreen');
const gameOverScreen = document.getElementById('gameOverScreen');
const countdownOverlay = document.getElementById('countdownOverlay');
const countdownText = document.getElementById('countdownText');
const startBtn = document.getElementById('startBtn');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');

const sbPass = document.getElementById('sbPass');
const sbScore = document.getElementById('sbScore');
const sbStage = document.getElementById('sbStage');
const rewardToast = document.getElementById('rewardToast');

function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
resizeCanvas();

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let musicInterval = null;
let musicStep = 0;

const luxuryMelody = [
    185, 0, 220, 0, 185, 185, 246, 0,
    220, 0, 185, 0, 220, 246, 185, 0
];

function playSoundEffect(freq, duration, vol, type = 'sine', delay = 0) {
    if (isPaused) return; 
    try {
        const now = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(vol * 0.4, now);
        gain.gain.linearRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.01);
    } catch(e){}
}

function playMusicNode() {
    if (!isPlaying || isPaused || isBurning) return; 
    const freq = luxuryMelody[musicStep % luxuryMelody.length];
    musicStep++;
    if (freq === 0) return;
    playSoundEffect(freq, 0.15, 0.4, 'triangle'); 
}

function startMusic() { stopMusic(); musicStep = 0; musicInterval = setInterval(playMusicNode, 180); } 
function stopMusic() { if (musicInterval) { clearInterval(musicInterval); musicInterval = null; } }
function playClickSound() { playSoundEffect(800, 0.02, 0.1, 'sine'); }
function playBeep() { playSoundEffect(550, 0.08, 0.15, 'sine'); }
function playRewardSound() {
    [523, 659, 784].forEach((f, i) => {
        playSoundEffect(f, 0.08, 0.15, 'sine', i * 0.06);
    });
}
function playMarioDeathSound() {
    const mNotes = [440, 392, 349, 293];
    mNotes.forEach((freq, idx) => {
        playSoundEffect(freq, idx === 3 ? 0.2 : 0.06, 0.4, 'sawtooth', idx * 0.06);
    });
}

const stageJobs = [
    { key: 'taxi', name: 'TAXI', color: '#facc15' },
    { key: 'police', name: 'POLICE', color: '#1e293b' }, 
    { key: 'ambulance', name: 'AMBU', color: '#f8fafc' },     
    { key: 'truck', name: 'TRUCK', color: '#0284c7' },       
    { key: 'fire', name: 'FIRE', color: '#dc2626' }             
];

const vehicleCacheCanvases = {};

function generateVehicleGraphicsCache(key, color, name, isPlayer = false) {
    const w = 90, h = 130;
    const cacheCanvas = document.createElement('canvas');
    cacheCanvas.width = w; cacheCanvas.height = h;
    const c = cacheCanvas.getContext('2d');

    c.fillStyle = 'rgba(0,0,0,0.3)';
    c.beginPath(); c.roundRect(6, 12, 78, 114, 20); c.fill();

    c.fillStyle = '#475569';
    c.fillRect(2, 22, 6, 18); c.fillRect(82, 22, 6, 18);
    c.fillRect(2, 92, 6, 18); c.fillRect(82, 92, 6, 18);

    c.fillStyle = color;
    c.beginPath();
    c.moveTo(14, 35); c.bezierCurveTo(14, 16, 24, 6, 45, 6); c.bezierCurveTo(66, 6, 76, 16, 76, 35);
    c.lineTo(78, 96); c.bezierCurveTo(78, 112, 70, 122, 45, 122); c.bezierCurveTo(20, 122, 12, 112, 12, 96);
    c.closePath(); c.fill();

    c.fillStyle = 'rgba(15,23,42,0.9)';
    c.beginPath();
    c.moveTo(20, 44); c.bezierCurveTo(22, 34, 30, 30, 45, 30); c.bezierCurveTo(60, 30, 68, 34, 70, 44);
    c.lineTo(72, 74); c.bezierCurveTo(72, 84, 66, 88, 45, 88); c.bezierCurveTo(24, 88, 18, 84, 18, 74);
    c.closePath(); c.fill();

    c.fillStyle = '#ffffff'; c.fillRect(16, 12, 10, 4); c.fillRect(64, 12, 10, 4);
    c.fillStyle = '#ef4444'; c.fillRect(18, 116, 12, 4); c.fillRect(60, 116, 12, 4);

    c.fillStyle = '#ffffff'; c.font = '900 10px sans-serif'; c.textAlign = 'center';
    c.fillText(name, 45, 62);

    vehicleCacheCanvases[key] = cacheCanvas;
}

function buildAllGraphicsCaches() {
    generateVehicleGraphicsCache('player', '#00e5ff', 'YOU', true);
    stageJobs.forEach((job, idx) => {
        generateVehicleGraphicsCache(job.key + '_' + idx, job.color, job.name, false);
    });
}
buildAllGraphicsCaches();

let score = 0;
let currentStageIndex = 0; 
let passedCarsCount = 0; 
let isPlaying = false;
let isPaused = false; 
let isBurning = false; 
let roadLinesY = 0;
let enemySpawnTimer = 0;
let enemies = [];
let particles = [];
let lastSpawnLane = -1; 

const player = {
    x: 250, y: 0,
    width: 54, height: 80, 
    speed: 7.5, 
    movingLeft: false, movingRight: false
};

function updateScoreUI() {
    sbPass.innerText = `PASS: ${passedCarsCount}/10`;
    sbScore.innerText = `SCORE: ${score}`;
    sbStage.innerText = `STAGE: ${currentStageIndex + 1}`;
}

function checkStageProgression() {
    passedCarsCount++;
    if (passedCarsCount >= 10) {
        passedCarsCount = 0;
        currentStageIndex = (currentStageIndex < stageJobs.length - 1) ? currentStageIndex + 1 : 0;
        showRewardNotification("مرحله جدید! سرعت و چالش بیشتر شد! 🔥");
    }
    updateScoreUI();
}

function showRewardNotification(text) {
    rewardToast.innerText = text;
    rewardToast.classList.add('show');
    playRewardSound();
    setTimeout(() => { rewardToast.classList.remove('show'); }, 2500);
}

class ExplodeParticle {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.radius = Math.random() * 5 + 2;
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4 + 1;
        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd - 1;
        this.alpha = 1;
        this.color = ['#ff2222', '#ff9900', '#ffff00', '#333333'][Math.floor(Math.random() * 4)];
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.04;
    }
    draw() {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

class EnemyCar {
    constructor() {
        this.jobSpec = stageJobs[currentStageIndex];
        this.width = 54;
        this.height = 80;
        
        const lanes = [canvas.width * 0.23, canvas.width * 0.5, canvas.width * 0.77];
        let laneIdx = Math.floor(Math.random() * lanes.length);
        if (laneIdx === lastSpawnLane) laneIdx = (laneIdx + 1) % lanes.length;
        lastSpawnLane = laneIdx;
        
        this.x = lanes[laneIdx];
        this.y = -100;
        this.speed = 6.5 + (currentStageIndex * 1.3); 
        this.passed = false;
        this.cacheKey = this.jobSpec.key + '_' + currentStageIndex;
    }
    update() { this.y += this.speed; }
    draw() {
        const imgCache = vehicleCacheCanvases[this.cacheKey];
        if (imgCache) {
            ctx.drawImage(imgCache, this.x - this.width/2, this.y - this.height/2, this.width, this.height);
        }
    }
}

function handleEnemies() {
    if (!isPaused && !isBurning) enemySpawnTimer++;
    
    let spawnInterval = Math.max(25, 55 - (currentStageIndex * 5));
    if (enemySpawnTimer > spawnInterval && !isPaused && !isBurning) {
        enemies.push(new EnemyCar());
        enemySpawnTimer = 0;
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        if (!isPaused && !isBurning) enemies[i].update();
        enemies[i].draw();

        if (!enemies[i].passed && enemies[i].y > player.y) {
            enemies[i].passed = true;
            score += 25;
            checkStageProgression();
        }

        if (enemies[i].y > canvas.height + 100) {
            enemies.splice(i, 1);
            continue;
        }

        if (!isBurning && intersects(player.x, player.y, player.width, player.height, enemies[i].x, enemies[i].y, enemies[i].width, enemies[i].height)) {
            triggerCarBurnEffect();
            return;
        }
    }
}

function intersects(x1, y1, w1, h1, x2, y2, w2, h2) {
    return Math.abs(x1 - x2) < (w1 + w2) / 2.4 && Math.abs(y1 - y2) < (h1 + h2) / 2.4;
}

function triggerCarBurnEffect() {
    isBurning = true;
    stopMusic(); 
    playMarioDeathSound();
    
    let burnCounter = 0;
    const burnInterval = setInterval(() => {
        for (let p = 0; p < 5; p++) {
            particles.push(new ExplodeParticle(player.x + (Math.random()*16 - 8), player.y + (Math.random()*20 - 10)));
        }
        burnCounter++;
        if (burnCounter > 15) { 
            clearInterval(burnInterval);
            gameOver();
        }
    }, 50);
}

function drawRoad() {
    ctx.fillStyle = '#161b22';
    ctx.fillRect(canvas.width * 0.08, 0, canvas.width * 0.84, canvas.height);

    ctx.fillStyle = '#1e3a1e';
    ctx.fillRect(0, 0, canvas.width * 0.08, canvas.height);
    ctx.fillRect(canvas.width * 0.92, 0, canvas.width * 0.08, canvas.height);

    const leftLimit = canvas.width * 0.08;
    const rightLimit = canvas.width * 0.92;

    ctx.fillStyle = '#f59e0b';
    ctx.fillRect(leftLimit, 0, 4, canvas.height);
    ctx.fillRect(rightLimit - 4, 0, 4, canvas.height);

    if (isPlaying && !isPaused && !isBurning) {
        if (player.x - player.width / 2 <= leftLimit + 4 || player.x + player.width / 2 >= rightLimit - 4) {
            triggerCarBurnEffect();
            return;
        }
    }

    ctx.fillStyle = '#ffffff';
    let roadSpeed = 7 + (currentStageIndex * 1.3);
    if (!isPaused && !isBurning) roadLinesY = (roadLinesY + roadSpeed) % 60;

    for (let y = roadLinesY - 60; y < canvas.height; y += 60) {
        ctx.fillRect(canvas.width * 0.38, y, 3, 30);
        ctx.fillRect(canvas.width * 0.62, y, 3, 30);
    }
}

function startCountdown() {
    welcomeScreen.style.display = 'none';
    gameOverScreen.style.display = 'none';
    pauseBtn.style.display = 'none';
    countdownOverlay.style.display = 'flex';
    
    let count = 3;
    countdownText.innerText = count;

    const interval = setInterval(() => {
        count--;
        if (count > 0) {
            countdownText.innerText = count;
        } else {
            clearInterval(interval);
            countdownOverlay.style.display = 'none';
            playBeep();
            isPlaying = true; isPaused = false; isBurning = false;
            pauseBtn.innerText = "Pause"; pauseBtn.style.display = 'block';
            startMusic(); 
            loop();
        }
    }, 800);
}

pauseBtn.addEventListener('click', () => {
    if (isBurning) return;
    isPaused = !isPaused;
    pauseBtn.innerText = isPaused ? "Resume" : "Pause";
    if (!isPaused) loop();
});

function gameOver() { 
    isPlaying = false; 
    pauseBtn.style.display = 'none'; 
    gameOverScreen.style.display = 'flex'; 
}

function resetGame() {
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    stopMusic(); 
    score = 0; currentStageIndex = 0; passedCarsCount = 0; lastSpawnLane = -1;
    isBurning = false;
    updateScoreUI();
    
    resizeCanvas();
    player.x = canvas.width / 2; 
    player.y = canvas.height * 0.78; 
    enemies = []; particles = []; enemySpawnTimer = 0;
    startCountdown();
}

function loop() {
    if (!isPlaying || isPaused) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawRoad();

    if (isPlaying && !isPaused && !isBurning) {
        if (player.movingLeft) player.x -= player.speed;
        if (player.movingRight) player.x += player.speed;
    }

    if (!isBurning) {
        const pCache = vehicleCacheCanvases['player'];
        if (pCache) {
            ctx.drawImage(pCache, player.x - player.width/2, player.y - player.height/2, player.width, player.height);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(); particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    handleEnemies();
    if (isPlaying && !isPaused) requestAnimationFrame(loop);
}

const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');

btnLeft.addEventListener('touchstart', (e) => { 
    if (e.cancelable) e.preventDefault(); 
    if(!isPaused && !isBurning) { player.movingLeft = true; playClickSound(); } 
}, { passive: false });
btnLeft.addEventListener('touchend', (e) => {
    if (e.cancelable) e.preventDefault();
    player.movingLeft = false;
}, { passive: false });

btnRight.addEventListener('touchstart', (e) => { 
    if (e.cancelable) e.preventDefault(); 
    if(!isPaused && !isBurning) { player.movingRight = true; playClickSound(); } 
}, { passive: false });
btnRight.addEventListener('touchend', (e) => {
    if (e.cancelable) e.preventDefault();
    player.movingRight = false;
}, { passive: false });

btnLeft.addEventListener('mousedown', () => { if(!isPaused && !isBurning) { player.movingLeft = true; playClickSound(); } });
btnLeft.addEventListener('mouseup', () => player.movingLeft = false);
btnLeft.addEventListener('mouseleave', () => player.movingLeft = false);
btnRight.addEventListener('mousedown', () => { if(!isPaused && !isBurning) { player.movingRight = true; playClickSound(); } });
btnRight.addEventListener('mouseup', () => player.movingRight = false);
btnRight.addEventListener('mouseleave', () => player.movingRight = false);

startBtn.addEventListener('click', resetGame);
